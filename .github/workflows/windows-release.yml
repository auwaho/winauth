name: Publish Windows build

on:
  push:
    branches: [master]

concurrency:
  group: latest-build
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build and package WinAuth.exe
        shell: pwsh
        run: ./scripts/Build-WindowsRelease.ps1 -OutputDirectory $env:RUNNER_TEMP

      - name: Verify the single-file release
        shell: pwsh
        run: ./scripts/Test-WindowsRelease.ps1 -ArchivePath (Join-Path $env:RUNNER_TEMP 'WinAuth.zip')

      - name: Publish Latest Build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/Publish-WindowsRelease.ps1 -ArchivePath (Join-Path $env:RUNNER_TEMP 'WinAuth.zip')
